name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmtcheck
      - name: vet
        run: make vet
      - name: staticcheck
        run: make staticcheck
      - name: test
        run: make race
      - name: build
        run: make build
